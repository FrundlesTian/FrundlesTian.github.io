<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>All My Friends</title>
    <style>
      body {
        margin: 0;
        font-family: Tahoma, Arial, sans-serif;
        color: #111;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(238, 243, 251, 0.9)),
          url("../res/images/treesep4.gif") center top / 96px repeat;
      }

      main {
        min-height: 100vh;
        padding: 24px;
      }

      .card {
        max-width: 860px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #b8c7dd;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        margin: 0 0 20px;
      }

      .gifs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 16px;
      }

      .gifs img {
        width: 56px;
        height: 56px;
        object-fit: contain;
      }

      .clustrmaps img {
        display: block;
        max-width: min(100%, 860px);
        height: auto;
        border: 1px solid #b8c7dd;
        background: white;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>All My Friends</h1>
        <p>Search hit: all_my_friends</p>
        <div class="gifs" aria-hidden="true">
          <img src="../res/images/apple_cat.gif" alt="" />
          <img src="../res/images/bigfoot.gif" alt="" />
          <img src="../res/images/kittycat.gif" alt="" />
        </div>
        <a
          class="clustrmaps"
          href="https://clustrmaps.com/site/1c94o"
          title="ClustrMaps"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="//www.clustrmaps.com/map_v2.png?d=7TPt_0ny1YPx3c77XAMEQ5kNWR9xOh-6brNq2ZquA_0&cl=ffffff"
            alt="ClustrMaps visitor map"
          />
        </a>
      </div>
    </main>
  </body>
</html>
